<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula14</title>
    <link rel="stylesheet" href="estilo.css">
   
</head>

<body>
    <h1>Seja Bem Vindo!!</h1>
    <h2>Por Gentileza preencha os campos abaixo para efetuar o cadastro:</h2>

    <main>
        <form id ="formulario">


                <p id="mensagem"></p>
            
                <label for="nome">nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">

                
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Digite seu email">


                
                <label for="telefone">telefone:</label>
                <input type="tel" id="telefone" placeholder="Digite seu telefone">

                
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Digite sua cidade">

                <button type="submit">Cadastrar</button>


                <script src="estilo.js"></script>
            
        </form>
    </main>
    
</body>

</html>
