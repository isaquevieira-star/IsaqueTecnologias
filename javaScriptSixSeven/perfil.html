<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
<body>
    <header>
        <h1>Bem-Vindo ao Perfil</h1>
    </header>
    <main>
        <form>
            <div>
                <img src="images/macaco.png" alt="Foto de Perfil" width="150"
                onemouserover="console.log('mouse sobre a imagem')">
            </div>
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="João da Silva" value="seu nome">
            </div>

            <div class="form-group">
                <label for="nascimento" class="form-label">Nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento"
                value="2000-01-01">
            </div>

            <div class="form-group">
                <button type="button" onclick="mensagem()">salvar</button>
            </div>
 
        </form>

    </main>
    <script type="text/javascript">
        function mensagem(){
            alert("Perfil salvo com sucesso!");
        }
    </script>
</body>
</html>
