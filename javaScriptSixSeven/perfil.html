<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <h1>Bem-Vindo ao Perfil</h1>
    </header>
    <main>
        <form>
            <div id="mensagem" class="alert alert-info" role="alert" style="display: none;">


            </div>

            <div>
                <img src="images/macaco.png" alt="Foto de Perfil" width="150"
                onmouseover="console.log('mouse sobre a imagem')">
            </div>
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="João da Silva">
            </div>

            <div class="form-group">
                <label for="nascimento" class="form-label">Nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento"
                value="2000-01-01">
            </div>

            <div class="form-group">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="CPF" value="123.456.789-00" onblur="validaCPF()">
            </div>

            <div class="form-group">
                <button type="button" onclick="mensagem()">salvar</button>
            </div>
        </form>
    </main>
    <script type="text/javascript">
        function mensagem(){
            const msg = document.querySelector('#mensagem');
            msg.style.display = "block";
            msg.textContent = "Perfil salvo com sucesso!";
        }

        function validaCPF(){
            const cpf = document.querySelector('#cpf').value;
            //implementar a validação do CPF aqui
            console.log(cpf);
            if(cpf.length !==11){
               const msg = document.querySelector('#mensagem');
            msg.style.display = "block";
            msg.textContent = "Cpf inválido! Deve conter 11 dígitos.";
        }
        }
    </script>
</body>
</html>
